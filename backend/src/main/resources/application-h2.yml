spring:
  datasource:
    url: jdbc:h2:mem:campus_food;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/seed.sql
  h2:
    console:
      enabled: true
      path: /h2-console

agent:
  llm:
    mock-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true